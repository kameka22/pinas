name: Build LibreELEC Image with PiNAS

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'libreelec/**'
      - 'scripts/lib/**'
      - '.github/workflows/build-libreelec.yml'

jobs:
  build-backend:
    # Static musl binaries for both supported targets (Raspberry Pi 5 and x86_64 PC/VM)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: x86_64
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build backend
        run: |
          cd backend
          cross build --release --target ${{ matrix.target }}

      - name: Verify binary
        run: |
          file backend/target/${{ matrix.target }}/release/pinas
          ls -lh backend/target/${{ matrix.target }}/release/pinas

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinas-binary-${{ matrix.arch }}
          path: backend/target/${{ matrix.target }}/release/pinas
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  build-libreelec:
    needs: [build-backend, build-frontend]
    # Pinned: LibreELEC 12.2 host tools (e.g. pkg-config's bundled glib) do not
    # build with GCC 15 / C23 (ubuntu-26.04, ubuntu-latest since Nov 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # GitHub's maximum for a hosted job
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 5: SD-card image (about 2 h 30, fits in one job)
          - name: rpi5
            project: RPi
            device: RPi5
            arch: aarch64
            kernel_conf: projects/RPi/devices/RPi5/linux/linux.aarch64.conf
            image_glob: LibreELEC.tv/target/*.img.gz
            handoff: false
          # Generic x86_64 PC / virtual machine: raw image + .ova appliance (mkimage builds both).
          # It needs more than 6 h from scratch (LLVM, Mesa...): this job stops after a
          # time budget and hands its build state over to build-libreelec-resume.
          - name: x86_64
            project: Generic
            device: Generic
            arch: x86_64
            kernel_conf: projects/Generic/linux/linux.x86_64.conf
            image_glob: |
              LibreELEC.tv/target/*.img.gz
              LibreELEC.tv/target/*.ova
            handoff: true

    steps:
      - name: Record job start (time budget)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Read LibreELEC branch (libreelec/BRANCH)
        run: echo "LIBREELEC_BRANCH=$(tr -d '[:space:]' < libreelec/BRANCH)" >> "$GITHUB_ENV"

      - name: Read PiNAS version (VERSION) and check it is propagated
        run: |
          scripts/sync-version.sh --check
          echo "PINAS_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: pinas-binary-${{ matrix.arch }}
          path: libreelec/packages/pinas/bin/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: libreelec/packages/pinas/www/

      - name: Make binary executable
        run: chmod +x libreelec/packages/pinas/bin/pinas

      - name: Install build dependencies and free disk space
        run: scripts/lib/ci-prepare-runner.sh

      - name: Clone LibreELEC
        run: |
          git clone --depth 1 --branch ${{ env.LIBREELEC_BRANCH }} \
            https://github.com/LibreELEC/LibreELEC.tv.git

      - name: Install PiNAS package
        run: |
          cp -r libreelec/packages/pinas LibreELEC.tv/packages/
          cp -r libreelec/packages/cups LibreELEC.tv/packages/
          rm -rf LibreELEC.tv/packages/addons/addon-depends/chrome-depends/cups
          cp -r libreelec/packages/pinas-nfs-server LibreELEC.tv/packages/
          scripts/lib/apply-kernel-config.sh LibreELEC.tv/${{ matrix.kernel_conf }}
          echo 'PKG_DEPENDS_TARGET="$PKG_DEPENDS_TARGET pinas"' >> \
            LibreELEC.tv/packages/virtual/mediacenter/package.mk

      # Source tarballs are cached between runs: a run that fails still saves what it
      # downloaded, so upstream mirror outages hurt at most once.
      - name: Restore LibreELEC source tarballs
        uses: actions/cache/restore@v6
        with:
          path: LibreELEC.tv/sources
          key: le-sources-${{ env.LIBREELEC_BRANCH }}-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: le-sources-${{ env.LIBREELEC_BRANCH }}-${{ matrix.name }}-

      # Some upstream tarballs can no longer be fetched (anti-bot wall on linuxtv.org,
      # release removed from releases.pagure.org): fetch them from a fallback mirror,
      # checked against LibreELEC's PKG_SHA256.
      - name: Prefetch sources unavailable upstream
        run: scripts/lib/prefetch-sources.sh LibreELEC.tv

      # Retries failed downloads (see the script). With handoff, the build stops 5 h after
      # the job started, leaving time to pack and upload its state before the 6 h limit.
      # AUTOREMOVE deletes each package's work tree once nothing depends on it any more,
      # which keeps that state small enough to hand over.
      - name: Build LibreELEC image
        id: build
        env:
          PROJECT: ${{ matrix.project }}
          DEVICE: ${{ matrix.device }}
          ARCH: ${{ matrix.arch }}
          AUTOREMOVE: ${{ matrix.handoff && 'yes' || 'no' }}
        run: |
          deadline=""
          if [ "${{ matrix.handoff }}" = "true" ]; then
            deadline=$(( JOB_START + 300 * 60 ))
          fi
          status=0
          scripts/lib/ci-make-image.sh LibreELEC.tv $deadline || status=$?
          if [ "$status" -eq 0 ]; then
            echo "finished=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo "finished=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Save LibreELEC source tarballs
        if: always()
        uses: actions/cache/save@v6
        with:
          path: LibreELEC.tv/sources
          key: le-sources-${{ env.LIBREELEC_BRANCH }}-${{ matrix.name }}-${{ github.run_id }}

      # The whole tree (LibreELEC checkout with the PiNAS packages, toolchain, built
      # packages and stamps) is handed over, so the next job resumes with exactly the
      # same sources. Tarballs travel through the cache above; ccache is left out.
      - name: Pack build state for build-libreelec-resume
        if: steps.build.outputs.finished == 'false'
        run: |
          state_dir=/mnt/le-state
          if ! sudo mkdir -p "$state_dir"; then state_dir="$RUNNER_TEMP/le-state"; mkdir -p "$state_dir"; fi
          sudo chown "$(id -u):$(id -g)" "$state_dir"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          tar -C "$GITHUB_WORKSPACE" -I 'zstd -T0 -3' -cf "$state_dir/le-state.tar.zst" \
            --exclude='LibreELEC.tv/sources' \
            --exclude='LibreELEC.tv/build.*/.ccache' \
            --exclude='LibreELEC.tv/build.*/.ccache-local' \
            --exclude='LibreELEC.tv/build.*/.threads' \
            LibreELEC.tv
          ls -lh "$state_dir"
          df -h

      - name: Upload build state
        if: steps.build.outputs.finished == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: le-build-state-${{ matrix.name }}
          path: ${{ env.STATE_DIR }}/le-state.tar.zst
          compression-level: 0  # already zstd-compressed
          retention-days: 1
          if-no-files-found: error

      - name: Name the virtual appliance after PiNAS
        if: matrix.arch == 'x86_64' && steps.build.outputs.finished == 'true'
        run: |
          cd LibreELEC.tv/target
          ova=$(ls LibreELEC-Generic.x86_64-*.ova | head -1)
          mv "$ova" "pinas-x86_64-${PINAS_VERSION}.ova"
          rm -f LibreELEC-Generic.x86_64-*.ova.sha256
          sha256sum "pinas-x86_64-${PINAS_VERSION}.ova" > "pinas-x86_64-${PINAS_VERSION}.ova.sha256"
          ls -lh

      - name: Upload image
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: libreelec-pinas-image-${{ matrix.name }}
          path: |
            ${{ matrix.image_glob }}
            LibreELEC.tv/target/*.sha256
          retention-days: 7

  build-libreelec-resume:
    # Second half of the builds that do not fit in one 6 h job (see `handoff` above):
    # picks up the build state packed by build-libreelec and finishes the image. When
    # the first job already built the image, there is no state and this job does nothing.
    needs: build-libreelec
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            project: Generic
            device: Generic
            arch: x86_64
            image_glob: |
              LibreELEC.tv/target/*.img.gz
              LibreELEC.tv/target/*.ova

    steps:
      - uses: actions/checkout@v7

      - name: Read LibreELEC branch and PiNAS version
        run: |
          echo "LIBREELEC_BRANCH=$(tr -d '[:space:]' < libreelec/BRANCH)" >> "$GITHUB_ENV"
          echo "PINAS_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Install build dependencies and free disk space
        run: scripts/lib/ci-prepare-runner.sh

      - name: Prepare build state directory
        run: |
          state_dir=/mnt/le-state
          if ! sudo mkdir -p "$state_dir"; then state_dir="$RUNNER_TEMP/le-state"; mkdir -p "$state_dir"; fi
          sudo chown "$(id -u):$(id -g)" "$state_dir"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"

      - name: Download build state
        id: state
        continue-on-error: true  # no state: the image was finished by build-libreelec
        uses: actions/download-artifact@v8
        with:
          name: le-build-state-${{ matrix.name }}
          path: ${{ env.STATE_DIR }}

      # Same absolute paths as in build-libreelec (same workspace), so the toolchain
      # and the build stamps stay valid.
      - name: Unpack build state
        if: steps.state.outcome == 'success'
        run: |
          tar -C "$GITHUB_WORKSPACE" -I zstd -xf "$STATE_DIR/le-state.tar.zst"
          rm -f "$STATE_DIR/le-state.tar.zst"
          df -h

      - name: Restore LibreELEC source tarballs
        if: steps.state.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: LibreELEC.tv/sources
          key: le-sources-${{ env.LIBREELEC_BRANCH }}-${{ matrix.name }}-${{ github.run_id }}-resume
          restore-keys: le-sources-${{ env.LIBREELEC_BRANCH }}-${{ matrix.name }}-

      - name: Prefetch sources unavailable upstream
        if: steps.state.outcome == 'success'
        run: scripts/lib/prefetch-sources.sh LibreELEC.tv

      - name: Finish LibreELEC image
        if: steps.state.outcome == 'success'
        env:
          PROJECT: ${{ matrix.project }}
          DEVICE: ${{ matrix.device }}
          ARCH: ${{ matrix.arch }}
          AUTOREMOVE: 'yes'
        run: scripts/lib/ci-make-image.sh LibreELEC.tv

      - name: Save LibreELEC source tarballs
        if: always() && steps.state.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: LibreELEC.tv/sources
          key: le-sources-${{ env.LIBREELEC_BRANCH }}-${{ matrix.name }}-${{ github.run_id }}-resume

      - name: Name the virtual appliance after PiNAS
        if: steps.state.outcome == 'success' && matrix.arch == 'x86_64'
        run: |
          cd LibreELEC.tv/target
          ova=$(ls LibreELEC-Generic.x86_64-*.ova | head -1)
          mv "$ova" "pinas-x86_64-${PINAS_VERSION}.ova"
          rm -f LibreELEC-Generic.x86_64-*.ova.sha256
          sha256sum "pinas-x86_64-${PINAS_VERSION}.ova" > "pinas-x86_64-${PINAS_VERSION}.ova.sha256"
          ls -lh

      - name: Upload image
        if: steps.state.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: libreelec-pinas-image-${{ matrix.name }}
          path: |
            ${{ matrix.image_glob }}
            LibreELEC.tv/target/*.sha256
          retention-days: 7

  release:
    # One draft release per VERSION, gathering the Pi image and the x86_64 image + OVA
    needs: [build-libreelec, build-libreelec-resume]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read PiNAS version
        run: echo "PINAS_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: libreelec-pinas-image-*
          path: images
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          # The tag is only created when the draft is published.
          tag_name: v${{ env.PINAS_VERSION }}
          name: PiNAS v${{ env.PINAS_VERSION }}
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.

            - `LibreELEC-RPi5.aarch64-*.img.gz` — Raspberry Pi 5 (flash to SD/NVMe)
            - `LibreELEC-Generic.x86_64-*.img.gz` — x86_64 PC (dd / qemu-img convert)
            - `pinas-x86_64-*.ova` — virtual appliance (VMware, VirtualBox, Proxmox, Synology VMM)

            Update archives and checksums come from `scripts/build-release.sh`.
          files: |
            images/*.img.gz
            images/*.ova
            images/*.sha256
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
