# Kernel options PiNAS needs on top of the LibreELEC defaults.
# Applied by scripts/lib/apply-kernel-config.sh to the project's linux.*.conf
# (LibreELEC only enables the NFS *client*; the server needs nfsd).
CONFIG_NFSD=y
CONFIG_NFSD_V3_ACL=y
CONFIG_NFSD_V4=y
CONFIG_NFSD_PNFS=n
CONFIG_NFS_ACL_SUPPORT=y
CONFIG_EXPORTFS=y
CONFIG_GRACE_PERIOD=y
