<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiNAS — maquettes de refonte</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#edf2fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d9e1ed;border-radius:8px;background:white;color:inherit;padding:9px 14px}button:hover{background:#edf3ff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #789efc;outline-offset:2px}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#174dcc}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#ffffffb8;border-bottom:1px solid #d9e1ed}.brand{font-size:20px;font-weight:750;letter-spacing:-1px}.brand span{color:#2563eb}.caption{font-size:12px;color:#526078}.desktop{padding:28px;min-height:90vh;background:radial-gradient(ellipse at 90% 0%,#d9e7ff,transparent 60%)}.window{max-width:1180px;margin:auto;background:#fff;border:1px solid #dbe3ef;border-radius:16px;overflow:hidden;box-shadow:0 18px 60px #20386316}.titlebar{padding:12px 18px;background:#f9fbff;border-bottom:1px solid #e5eaf2;display:flex;justify-content:space-between}.layout{display:grid;grid-template-columns:190px 1fr;min-height:580px}.sidebar{background:#f8faff;border-right:1px solid #e5eaf2;padding:24px 12px}.section{font-size:11px;letter-spacing:1px;color:#526078;padding:0 12px 12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;margin:4px 0}.nav.active{color:#1d4ed8;background:#e8efff;font-weight:650}.main{padding:28px;min-width:0}h1{font-size:24px;letter-spacing:-.7px;margin:0 0 6px}h2{font-size:16px;margin:0 0 18px}p{color:#526078;line-height:1.6;margin:0 0 22px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.head p{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat{padding:18px;border:1px solid #e2e8f1;border-radius:12px}.value{font-size:24px;font-weight:650;margin-top:8px;letter-spacing:-.5px}.muted{color:#526078;font-size:12px}.toolbar{display:flex;gap:12px;margin-bottom:16px}.toolbar input{max-width:320px;width:100%}input,select{border:1px solid #ccd6e5;border-radius:8px;padding:10px;background:#fff;color:#172033}.tablewrap{overflow:auto;border:1px solid #e2e8f1;border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{background:#f8faff;color:#526078;font-size:12px;font-weight:550}td,th{padding:14px 16px;border-bottom:1px solid #edf0f6}tr:last-child td{border-bottom:0}.resource{display:flex;gap:12px;align-items:center}.icon{background:#edf3ff;color:#2563eb;padding:9px;border-radius:10px;font-size:18px}.badge{display:inline-block;background:#e9f6ee;color:#21623d;border-radius:20px;padding:4px 9px;font-size:12px}.tabs{display:flex;gap:20px;border-bottom:1px solid #e2e8f1;margin-bottom:24px;overflow:auto}.tab{border:0;border-radius:0;padding:12px 0;white-space:nowrap}.tab.active{color:#2563eb;border-bottom:2px solid #2563eb}.card{border:1px solid #e2e8f1;padding:24px;border-radius:12px;margin-bottom:16px}.row{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:12px 0;align-items:center}.row label{color:#526078}.row input,.row select{width:100%;max-width:440px}.footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e2e8f1;padding-top:20px;margin-top:24px}.back{border:0;padding-left:0;color:#526078;margin-bottom:16px}.notice{border-radius:10px;background:#edf3ff;color:#294c8b;padding:14px;margin:16px 0;line-height:1.6}.steps{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}.step{color:#526078;padding:8px 12px;border-radius:20px;background:#f1f4fa}.step.current{color:#1d4ed8;background:#e8efff}.bar{height:8px;background:#eaf0f8;border-radius:6px;margin-top:12px}.bar span{display:block;background:#2563eb;width:38%;height:100%;border-radius:6px}#feedback{color:#21623d;min-height:24px;padding-top:12px}@media(max-width:700px){.desktop{padding:12px}.layout{grid-template-columns:1fr}.sidebar{display:flex;gap:4px;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid #e2e8f1}.section{display:none}.nav{width:auto;white-space:nowrap}.main{padding:18px}.head{align-items:flex-start;flex-wrap:wrap}.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:8px}.top{padding:12px;gap:12px}.caption{max-width:200px}.value{font-size:22px}}@media(prefers-color-scheme:dark){:root{color:#e4eaf5;background:#101827}.desktop{background:#101827}.window,.card,button,input,select{background:#192338;color:#e4eaf5;border-color:#354258}.top,.titlebar,.sidebar,th{background:#151f31;color:#e4eaf5}.muted,p,.caption,.section,.row label,.back{color:#b2bfd4}.stat,.tablewrap,td,th,.tabs,.footer,.sidebar,.titlebar{border-color:#354258}.nav.active,.step.current,.notice,.icon{background:#233d65;color:#bfd4ff}.step{background:#263247;color:#c1cde0}.primary{background:#2563eb;color:white}.badge{background:#203e32;color:#a7e8be}button:hover{background:#304365}}
</style><header class="top"><div class="brand">Pi<span>NAS</span> <small class="muted">/ Direction visuelle 01</small></div><div class="caption">Prototype interactif · données fictives<br>Aucune action sur le NAS</div></header><div class="desktop"><div class="window"><div class="titlebar"><b id="apptitle">Gestion du NAS</b><span class="muted">Maquette · 17 novembre 2026</span></div><div class="layout"><nav class="sidebar" aria-label="Applications"><div class="section">ESPACE DE TRAVAIL</div><button class="nav" data-app="shares">▤ &nbsp; Partages</button><button class="nav" data-app="users">♙ &nbsp; Utilisateurs</button><button class="nav" data-app="disks">▣ &nbsp; Stockage</button></nav><main class="main" id="content"></main></div></div></div><script>
let app='shares',view='list',tab='Général',selected='',step=0;const draft={name:'Archives',path:'/volume1/Archives',access:'Lecture et écriture',protocol:'SMB'};
const config={shares:{title:'Dossiers partagés',description:'Vos fichiers, accessibles aux bonnes personnes.',action:'Créer un partage',stats:[['Dossiers partagés','3'],['Services configurés','SMB · NFS'],['Volume principal','38 % utilisé']],headers:['Dossier','Emplacement','Services',''],rows:[['Documents','/volume1/Documents','SMB'],['Photos','/volume1/Photos','SMB · NFS'],['Sauvegardes','/volume1/Sauvegardes','SMB']]},users:{title:'Utilisateurs',description:'Un accès clair pour chaque membre de votre foyer.',action:'Créer un utilisateur',stats:[['Utilisateurs','3'],['Administrateurs','1'],['Groupes','2']],headers:['Utilisateur','Rôle','État',''],rows:[['Laurent','Administrateur','Actif'],['Alice','Utilisateur','Actif'],['Invité','Utilisateur','Désactivé']]},disks:{title:'Disques',description:'La santé de votre stockage, en un regard.',stats:[['Disques','2'],['Température maximale','34 °C'],['État global','Sain']],headers:['Disque','Capacité','État',''],rows:[['Disque 1','3,6 TiB','Sain'],['Disque 2','3,6 TiB','Sain']]}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const input=(label,value,key)=>`<div class="row"><label for="${key}">${label}</label><input id="${key}" value="${esc(value)}" data-draft="${key}"></div>`;
function render(){const c=config[app];document.querySelectorAll('[data-app]').forEach(b=>b.classList.toggle('active',b.dataset.app===app));document.getElementById('apptitle').textContent=app==='disks'?'Gestionnaire de stockage':app==='users'?'Panneau de configuration':'Partages';let h='';if(view==='list'){h=`<div class="head"><div><h1>${c.title}</h1><p>${c.description}</p></div>${c.action?`<button class="primary" data-action="create">＋ ${c.action}</button>`:''}</div><div class="stats">${c.stats.map(s=>`<div class="stat"><div class="muted">${s[0]}</div><div class="value">${s[1]}</div></div>`).join('')}</div><div class="toolbar"><input aria-label="Rechercher" id="search" placeholder="Rechercher ${app==='users'?'un utilisateur':app==='disks'?'un disque':'un dossier'}…"></div><div class="tablewrap"><table><thead><tr>${c.headers.map(t=>`<th scope="col">${t}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr data-row="${esc(r.join(' ').toLowerCase())}"><td><div class="resource"><span class="icon">${app==='shares'?'▤':app==='users'?'♙':'▣'}</span><b>${r[0]}</b></div></td><td>${r[1]}</td><td>${app==='shares'?r[2]:`<span class="badge">${r[2]}</span>`}</td><td><button data-open="${r[0]}">Ouvrir →</button></td></tr>`).join('')}</tbody></table></div>`}
else if(view==='create'&&app==='shares'){const names=['Emplacement','Accès','Options','Résumé'];h=`<button class="back" data-action="back">← Dossiers partagés</button><h1>Créer un partage</h1><p>Un parcours continu, dans la même fenêtre.</p><div class="steps">${names.map((n,i)=>`<span class="step ${i===step?'current':''}" ${i===step?'aria-current="step"':''}>${i+1}. ${n}</span>`).join('')}</div><div class="card"><h2>${names[step]}</h2>${step===0?input('Nom du partage',draft.name,'name')+input('Emplacement',draft.path,'path')+'<div class="notice">Sélecteur intégré · Volume 1 / Archives<br>Le choix du dossier garde le formulaire visible.</div>':step===1?'<div class="row"><label for="access">Groupe famille</label><select id="access" data-draft="access">'+['Lecture et écriture','Lecture seule','Pas d’accès'].map(v=>`<option ${v===draft.access?'selected':''}>${v}</option>`).join('')+'</select></div><p>La distinction entre accès par défaut et refus explicite sera conservée.</p>':step===2?'<div class="row"><label for="protocol">Service</label><select id="protocol" data-draft="protocol">'+['SMB','NFS'].map(v=>`<option ${v===draft.protocol?'selected':''}>${v}</option>`).join('')+'</select></div>':`<p><b>${esc(draft.name)}</b><br>${esc(draft.path)}<br>Famille : ${esc(draft.access)}<br>Service : ${draft.protocol}</p><div class="notice">Démonstration : aucun dossier ni droit ne sera créé.</div>`}</div><div class="footer">${step?'<button data-action="prev">Précédent</button>':''}<button class="primary" data-action="next">${step===3?'Terminer la démonstration':'Continuer →'}</button></div>`}
else{let tabs=app==='shares'?['Général','Accès','SMB','NFS']:app==='users'?['Profil','Groupes','Accès','Services']:['Vue d’ensemble','SMART','Alimentation'];h=`<button class="back" data-action="back">← ${c.title}</button><div class="head"><div><h1>${selected||'Nouvel utilisateur'}</h1><p>${app==='disks'?'SATA · Pool principal · Données fictives':'Configuration regroupée dans une seule fiche.'}</p></div><span class="badge">${app==='disks'?'Sain':'Configuration'}</span></div><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${tab===t}" class="tab ${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="card">${detail()}</div>${app!=='disks'?'<div class="footer"><button data-action="back">Annuler</button><button class="primary" data-action="save">Enregistrer la démonstration</button></div>':''}<div id="feedback" role="status"></div>`}document.getElementById('content').innerHTML=h;}
function detail(){if(app==='shares'){if(tab==='Général')return '<h2>Informations du dossier</h2>'+input('Nom',selected,'share-name')+input('Emplacement','/volume1/'+selected,'share-path')+'<div class="notice">Les options du partage sont regroupées ici. Aucun formulaire superposé.</div>';if(tab==='Accès')return '<h2>Accès au dossier</h2><div class="row"><label for="permission">Famille</label><select id="permission"><option>Lecture et écriture</option><option>Lecture seule</option><option>Pas d’accès — refus explicite</option><option>Par défaut — retirer la règle</option></select></div><p>L’accès effectif et son origine devront être affichés uniquement si l’API les fournit.</p>';return '<h2>Service '+tab+'</h2><div class="notice">Emplacement proposé pour les options '+tab+' existantes. La séparation des partages SMB et NFS dans le modèle actuel reste à respecter.</div>'}if(app==='users'){if(tab==='Profil')return '<h2>Profil</h2>'+input('Nom',selected||'Nouveau membre','user-name')+'<div class="row"><label for="role">Rôle</label><select id="role"><option>Utilisateur</option><option>Administrateur</option></select></div>';if(tab==='Accès')return '<h2>Dossiers autorisés</h2><div class="row"><label for="user-access">Documents</label><select id="user-access"><option>Lecture et écriture</option><option>Lecture seule</option><option>Pas d’accès — refus explicite</option><option>Par défaut — retirer la règle</option></select></div><div class="notice">L’ajout et le choix de dossier s’intégreront à cette page, sans empiler de modales.</div>';return '<h2>'+tab+'</h2><div class="row"><span>'+ (tab==='Groupes'?'Famille':'SMB')+'</span><span class="badge">'+(tab==='Groupes'?'Membre':'Autorisé')+'</span></div>'}if(tab==='Vue d’ensemble')return '<h2>État du disque</h2><div class="row"><span>Santé</span><span class="badge">Sain</span></div><div class="row"><span>Capacité</span><b>3,6 TiB</b></div><div class="row"><span>Température</span><b>34 °C</b></div><div class="row"><span>Pool</span><b>Pool principal</b></div>';if(tab==='SMART')return '<h2>Diagnostic SMART</h2><p>Dernier résultat simulé : aucun défaut détecté.</p><button data-action="diagnostic">Simuler un test court</button><div class="notice">En production : état indisponible explicite si le matériel ne supporte pas SMART.</div>';return '<h2>Alimentation</h2><div class="row"><label for="standby">Mise en veille</label><select id="standby"><option>Après 20 minutes</option><option>Jamais</option></select></div><button data-action="save">Enregistrer la démonstration</button>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.app){app=b.dataset.app;view='list';}else if(b.dataset.open){selected=b.dataset.open;view='detail';tab=app==='shares'?'Général':app==='users'?'Profil':'Vue d’ensemble'}else if(b.dataset.tab){tab=b.dataset.tab}else{switch(b.dataset.action){case'create':view='create';step=0;selected='';tab='Profil';break;case'back':view='list';break;case'prev':step--;break;case'next':if(step<3){if(!draft.name.trim()||!draft.path.trim())return;step++}else view='list';break;case'save':case'diagnostic':document.getElementById('feedback').textContent=b.dataset.action==='save'?'Démonstration enregistrée localement à l’écran. Aucune requête envoyée.':'Test simulé terminé : aucun défaut détecté.';return}}render()});document.addEventListener('input',e=>{if(e.target.dataset.draft)draft[e.target.dataset.draft]=e.target.value;if(e.target.id==='search')document.querySelectorAll('[data-row]').forEach(r=>r.hidden=!r.dataset.row.includes(e.target.value.toLowerCase()))});render();
</script></html>
