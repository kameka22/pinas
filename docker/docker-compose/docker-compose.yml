services:
  # Rust Backend
  # Port 3388 = PINAS_BIND_ADDRESS de backend/.env.dev (cible du proxy Vite)
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/dockerfiles/backend.Dockerfile
    ports:
      - "3388:3388"
    volumes:
      - ../../backend:/app
      - backend-cargo-cache:/usr/local/cargo/registry
      - backend-target:/app/target
    environment:
      # Variables lues via config::Environment::with_prefix("PINAS") (cf. backend/src/config/mod.rs)
      - PINAS_BIND_ADDRESS=0.0.0.0:3388
      - PINAS_DATABASE_URL=sqlite:./data/pinas.db?mode=rwc
      - PINAS_DATA_DIR=./data
      - PINAS_FILES_ROOT=./data/files
      - PINAS_HOMES_ROOT=./data/homes
      - PINAS_PACKAGES_DIR=./data/packages
      - PINAS_DOWNLOADS_DIR=./data/downloads
      - PINAS_BIN_DIR=./data/bin
      - PINAS_DEV_MODE=true
      # PINAS_JWT_SECRET omis : auto-généré au premier démarrage dans ${PINAS_DATA_DIR}/.jwt_secret
      - RUST_LOG=pinas=debug,tower_http=debug
      - RUST_BACKTRACE=1
    command: cargo watch -x run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3388/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SvelteKit Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/dockerfiles/frontend.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  backend-cargo-cache:
  backend-target:
  frontend-node-modules:
